plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:2.2.10'
    }
}

android {
    namespace 'it.airbagstudio.ticare'
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "ch.ticare.eclinic"
        minSdk 28
        targetSdk 36
        //noinspection HighAppVersionCode
        versionCode 2026051101
        versionName "1.2.50"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_VERSION", "\"1.0\""
        }
        debug {
            buildConfigField "String", "API_VERSION", "\"1.0\""
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
    }

    packaging {
        jniLibs {
            keepDebugSymbols += "**/*.so"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    flavorDimensions += 'env'
    productFlavors {
        create("develop") {
            dimension = "env"
            applicationId "ch.ticare.eclinic.app.dev"
        }
        create("preProd") {
            dimension = "env"
            applicationId "ch.ticare.eclinic.app"
        }
        create("mdm") {
            dimension = "env"
            applicationId "ch.ticare.eclinic.app.mdm"
        }
    }
}

dependencies {
    implementation "ch.ticare.eclinic:shared-android:1.1.0"

    // Kotlin BOM per allineamento versioni con la libreria eclinic
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.10')

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation platform('androidx.compose:compose-bom:2026.01.01')
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.foundation:foundation")
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation "com.google.dagger:hilt-android:2.59.2"
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    ksp 'com.google.dagger:hilt-compiler:2.59.2'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "io.coil-kt:coil:2.7.0"
    implementation "io.coil-kt:coil-compose:2.7.0"

    implementation("me.saket.telephoto:zoomable:0.6.2")

    implementation("io.ktor:ktor-client-core:2.3.12")
    implementation("io.ktor:ktor-client-logging:2.3.12")
    implementation("io.ktor:ktor-client-content-negotiation:2.3.12")
    implementation("io.ktor:ktor-serialization-kotlinx-json:2.3.12")
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'com.github.tony19:logback-android:3.0.0'
    implementation("io.ktor:ktor-client-okhttp:2.3.12")
    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.6.1")
    implementation("app.cash.sqldelight:android-driver:2.0.2")
    implementation("app.cash.sqldelight:sqlite-driver:2.0.2")
    implementation("app.cash.sqldelight:primitive-adapters:2.0.2")
    implementation("app.cash.sqldelight:coroutines-extensions:2.0.2")

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation("com.google.firebase:firebase-crashlytics")

    implementation "dev.shreyaspatil:capturable:2.1.0"

    implementation("androidx.enterprise:enterprise-feedback:1.1.0")
    implementation("androidx.compose.material:material-icons-core")
    implementation("androidx.compose.material:material-icons-extended")
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    implementation 'com.patrykandpatrick.vico:compose-m3:3.0.0'
}