plugins {
    id 'kotlin-kapt'
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'it.airbagstudio.ticare'
    compileSdk 34

    defaultConfig {
        applicationId "ch.ticare.eclinic"
        minSdk 28
        targetSdk 34
        versionCode 46
        versionName "1.1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.4.6"
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    flavorDimensions 'env'
    productFlavors {
        develop{
            applicationId "ch.ticare.eclinic.app.dev"
        }
        preProd{
            applicationId "ch.ticare.eclinic.app"
        }
    }
    buildTypes {
        release {
            buildConfigField "String", "API_VERSION", "\"1.0\""
        }
        debug {
            buildConfigField "String", "API_VERSION", "\"1.0\""
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.material3:material3:1.2.0-rc01'
    implementation("androidx.compose.material3:material3-window-size-class:1.1.2")
    implementation 'androidx.navigation:navigation-compose:2.7.4'
    implementation "com.google.dagger:hilt-android:2.48"
    implementation files('src/main/libs/shared-debug.aar')
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0-rc01'
    kapt 'com.google.dagger:hilt-compiler:2.48'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.5.4'
    implementation 'androidx.hilt:hilt-navigation-compose:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    debugImplementation "androidx.compose.ui:ui-tooling:1.5.4"
    implementation "io.coil-kt:coil:2.4.0"
    implementation "io.coil-kt:coil-compose:2.4.0"

    implementation("me.saket.telephoto:zoomable:0.6.2")

    implementation("io.ktor:ktor-client-core:2.3.4")
    implementation("io.ktor:ktor-client-logging:2.3.4")
    implementation("io.ktor:ktor-client-content-negotiation:2.3.4")
    implementation("io.ktor:ktor-serialization-kotlinx-json:2.3.4")
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'com.github.tony19:logback-android:2.0.0'
    implementation("io.ktor:ktor-client-okhttp:2.3.4")
    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.4.1")
    implementation("app.cash.sqldelight:android-driver:2.0.0")
    implementation("app.cash.sqldelight:sqlite-driver:2.0.0")
    implementation("app.cash.sqldelight:primitive-adapters:2.0.0")
    implementation("app.cash.sqldelight:coroutines-extensions:2.0.0")

    implementation platform('com.google.firebase:firebase-bom:32.3.1')
    implementation("com.google.firebase:firebase-crashlytics")

    implementation "dev.shreyaspatil:capturable:2.0.0"

}
kapt {
    correctErrorTypes true
}